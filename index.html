<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 قفل الجهاز</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .box {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            max-width: 350px;
            width: 90%;
        }
        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }
        h1 {
            color: #e94560;
            font-size: 26px;
            margin-bottom: 8px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #e94560;
            border-radius: 12px;
            background: #0a0a1a;
            color: white;
            outline: none;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #c73652;
        }
        .msg {
            margin-top: 12px;
            font-size: 14px;
            min-height: 25px;
        }
        .success {
            color: #4CAF50;
        }
        .error {
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🔒</div>
        <h1>الجهاز مقفل</h1>
        <p>أدخل كلمة المرور لفتح القفل</p>
        <input type="password" id="pwd" placeholder="•••••" maxlength="10" autofocus>
        <button onclick="unlock()">🔓 فتح</button>
        <div class="msg" id="msg"></div>
    </div>

    <script>
        const PASSWORD = "12345";

        function unlock() {
            const input = document.getElementById('pwd');
            const msg = document.getElementById('msg');
            
            if (input.value === PASSWORD) {
                msg.className = 'msg success';
                msg.textContent = '✅ تم فتح الجهاز!';
                input.disabled = true;
                document.querySelector('button').disabled = true;
                
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 1500);
            } else {
                msg.className = 'msg error';
                msg.textContent = '❌ كلمة المرور غير صحيحة!';
                input.value = '';
                input.focus();
                
                // تأثير اهتزاز بسيط
                input.style.borderColor = 'red';
                setTimeout(() => {
                    input.style.borderColor = '#e94560';
                }, 500);
            }
        }

        // ===== منع زر العودة =====
        history.pushState(null, null, location.href);
        window.onpopstate = function() {
            history.go(1);
        };

        // ===== منع إعادة التحميل =====
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });

        // ===== تنبيه عند محاولة الخروج =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
                alert('⚠️ لا يمكنك إعادة تحميل الصفحة!');
            }
        });

        // ===== عند تحميل الصفحة =====
        window.onload = function() {
            document.getElementById('pwd').focus();
        };
    </script>
</body>
</html>
